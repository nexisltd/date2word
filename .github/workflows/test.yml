name: Testing
on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
